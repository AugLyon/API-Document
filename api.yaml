openapi: 3.0.0
info:
  title: Enable Code API - Complete Specification
  version: 1.1.0
  description: >
    Complete API endpoints for User Authentication, Lessons, User Progress,
    Custom Blocks, and Calibrations for the Enable Code platform.
    Designed for users with hand disabilities to learn Python via facial gestures.
servers:
  # Added by API Auto Mocking Plugin
  - description: SwaggerHub API Auto Mocking
    url: https://virtserver.swaggerhub.com/none-6a6-179/Enable_Code/1.1.0
  - url: http://localhost:5000
    description: Local Development Server

paths:
  # ========================================
  # AUTHENTICATION
  # ========================================
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Creates a new user account in the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request (e.g., email already exists)

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User Login
      description: Authenticates a user and returns a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Unauthorized (Invalid email or password)

  # ========================================
  # USERS & PROFILE
  # ========================================
  /api/users/profile:
    get:
      tags:
        - Users
      summary: Get user profile
      description: Retrieves the profile data of the currently authenticated user.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
    put:
      tags:
        - Users
      summary: Update user profile
      description: Updates basic profile information like name and avatar.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
    delete:
      tags:
        - Users
      summary: Delete user account
      description: Deletes the currently authenticated user's account and associated data.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account deleted successfully
        "401":
          description: Unauthorized

  /api/users/stats:
    get:
      tags:
        - Users
      summary: Get user statistics
      description: Retrieves aggregated stats for the user (total score, streak, lessons completed).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User statistics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_score:
                    type: integer
                    description: "Total points accumulated across all lessons"
                    example: 2450
                  streak:
                    type: integer
                    description: "Number of consecutive days the user has been active"
                    example: 7
                  lessons_completed:
                    type: integer
                    description: "Total number of lessons successfully passed"
                    example: 12
                  level:
                    type: integer
                    description: "Current gamified level of the user based on XP"
                    example: 5
        "401":
          description: Unauthorized

  /api/users/calibration:
    get:
      tags:
        - Users
      summary: Get user calibration settings
      description: Retrieves the user's specific facial boundary and preference calibration from the calibrations table.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Calibration data retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calibration"
        "404":
          description: Calibration data not found
    put:
      tags:
        - Users
      summary: Recalibrate AI settings
      description: Updates the user's specific facial/gesture calibration settings in the calibrations table.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalibrationRequest"
      responses:
        "200":
          description: Calibration settings updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calibration"
        "401":
          description: Unauthorized

  # ========================================
  # TOPICS
  # ========================================
  /api/topics:
    get:
      tags:
        - Topics
      summary: Get all topics
      description: Retrieves a list of all educational topics.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A list of topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"

  /api/topics/{topicId}/lessons:
    get:
      tags:
        - Topics
      summary: Get lessons by topic
      description: Retrieves all lessons belonging to a specific topic.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: topicId
          required: true
          schema:
            type: string
          example: "60d5ecb8b392d700153f3a77"
      responses:
        "200":
          description: A list of lessons for the topic
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lesson"

  # ========================================
  # LESSONS
  # ========================================
  /api/lessons:
    get:
      tags:
        - Lessons
      summary: Get all lessons
      description: Retrieves a paginated list of all lessons. Supports filtering.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: topic_id
          schema:
            type: string
          description: Filter lessons by topic ObjectId
        - in: query
          name: difficulty
          schema:
            type: string
            enum: [SSS, SS, S, A, B, C, D, F]
          description: Filter by difficulty tier
        - in: query
          name: is_active
          schema:
            type: boolean
          description: Filter by active status (admin/teacher only)
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated list of lessons
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Lesson"
                  total:
                    type: integer
                    description: "Total number of lessons matching criteria"
                    example: 42
                  page:
                    type: integer
                    description: "Current page number"
                    example: 1
                  limit:
                    type: integer
                    description: "Items per page"
                    example: 20
        "401":
          description: Unauthorized

    post:
      tags:
        - Lessons
      summary: Create a new lesson
      description: Creates a new lesson. Restricted to admin and teacher roles.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLessonRequest"
      responses:
        "201":
          description: Lesson created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "400":
          description: Validation error
        "403":
          description: Forbidden — insufficient role

  /api/lessons/{lessonId}:
    get:
      tags:
        - Lessons
      summary: Get a specific lesson
      description: Retrieves the full details of a lesson by its ID including public test cases and block configurations.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
          example: "60d5ecb8b392d700153f3a55"
      responses:
        "200":
          description: Lesson details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "401":
          description: Unauthorized
        "404":
          description: Lesson not found

    put:
      tags:
        - Lessons
      summary: Update a lesson
      description: Updates any field of an existing lesson. Restricted to admin and teacher roles.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLessonRequest"
      responses:
        "200":
          description: Lesson updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "403":
          description: Forbidden
        "404":
          description: Lesson not found

    delete:
      tags:
        - Lessons
      summary: Delete a lesson
      description: Permanently deletes a lesson and all associated user progress records.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lesson deleted successfully
        "403":
          description: Forbidden

  /api/lessons/{lessonId}/submit:
    post:
      tags:
        - Lessons
      summary: Submit lesson workspace
      description: Submits the user's final Blockly workspace for grading. The backend executes the generated code via Piston against hidden test cases. Updates UserProgress.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitLessonRequest"
      responses:
        "200":
          description: Submission graded and progress updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitLessonResponse"
        "400":
          description: Invalid workspace state
        "404":
          description: Lesson not found

  /api/lessons/{lessonId}/save-progress:
    post:
      tags:
        - Lessons
      summary: Save workspace progress (draft)
      description: Autosaves the current state of the user's Blockly workspace without grading.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProgressRequest"
      responses:
        "200":
          description: Workspace progress saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProgress"

  /api/lessons/{lessonId}/progress:
    get:
      tags:
        - Lessons
      summary: Get current user's progress for a lesson
      description: Returns the authenticated user's UserProgress record for this lesson, including saved workspace state for resuming.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User progress for the lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProgress"
        "404":
          description: No progress record found

  /api/lessons/{lessonId}/hint:
    get:
      tags:
        - Lessons
      summary: Get hints for a lesson
      description: Returns the ordered list of hints for the lesson progressively.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
        - in: query
          name: index
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Hint returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  index:
                    type: integer
                    example: 0
                  total:
                    type: integer
                    example: 3
                  hint:
                    type: object
                    example:
                      {
                        "text": "Use the mouth_open gesture to drag the block.",
                        "type": "text",
                      }

  /api/lessons/{lessonId}/toggle-active:
    patch:
      tags:
        - Lessons
      summary: Toggle lesson active status
      description: Flips the is_active flag on a lesson.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Active status toggled

  # ========================================
  # USER PROGRESS
  # ========================================
  /api/progress:
    get:
      tags:
        - Progress
      summary: Get all user progress
      description: Retrieves all progress records for the authenticated user across all lessons.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A list of user progress records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProgress"

  /api/progress/{lessonId}:
    get:
      tags:
        - Progress
      summary: Get progress for a specific lesson
      description: Retrieves the user's progress for a specific lesson ID.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Progress retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProgress"

  # ========================================
  # CUSTOM BLOCKS
  # ========================================
  /api/custom-blocks:
    get:
      tags:
        - Custom Blocks
      summary: Get all custom blocks
      description: Loads the definitions and Python generator code for custom Blockly blocks from the database.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: category
          schema:
            type: string
          description: Filter blocks by category (e.g., "Movement", "Logic")
      responses:
        "200":
          description: Custom blocks loaded
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomBlock"

  /api/custom-blocks/{blockId}:
    get:
      tags:
        - Custom Blocks
      summary: Get a specific custom block
      description: Retrieves details for a specific custom block definition.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: blockId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Custom block details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomBlock"

# ========================================
  # LEADERBOARD
  # ========================================
  /api/leaderboard:
    get:
      tags:
        - Leaderboard
      summary: Get user leaderboard
      description: Retrieves a paginated ranking of users based on their total score.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: "Page number for pagination"
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: "Number of users per page"
      responses:
        "200":
          description: Leaderboard ranking
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: string
                          example: "60d5ecb8b392d700153f3a45"
                        name:
                          type: string
                          example: "Nguyen Van A"
                        avatar:
                          type: string
                          example: "https://enablecode.vn/avatars/user.jpg"
                        total_score:
                          type: integer
                          example: 2450
                        lessons_completed:
                          type: integer
                          example: 12
                  total:
                    type: integer
                    description: "Total number of ranked users"
                    example: 150
                  page:
                    type: integer
                    description: "Current page number"
                    example: 1
                  limit:
                    type: integer
                    description: "Items per page"
                    example: 10

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ----------------------------------------
    # Core Data Schemas
    # ----------------------------------------
    User:
      type: object
      description: "Represents a registered user in the platform."
      properties:
        _id:
          type: string
          description: "MongoDB ObjectId of the user"
          example: "60d5ecb8b392d700153f3a45"
        email:
          type: string
          format: email
          description: "User's email address for login"
          example: "student_handsfree@enablecode.vn"
        role:
          type: string
          description: "Role-based access control level"
          enum: [student, teacher, admin]
          example: "student"
        name:
          type: string
          description: "Full display name of the user"
          example: "Nguyen Huu Tri"
        avatar:
          type: string
          description: "URL link to user profile picture"
          example: "https://enablecode.vn/avatars/tri_nguyen.jpg"
        total_score:
          type: integer
          description: "Total leaderboard points accumulated"
          example: 1200
        lessons_completed:
          type: integer
          description: "Total count of lessons fully passed"
          example: 5
        streak:
          type: integer
          description: "Consecutive daily login and coding streak"
          example: 3
        level:
          type: integer
          description: "Gamification level based on XP/total_score"
          example: 2
        last_active_date:
          type: string
          format: date-time
          description: "Timestamp of the user's last interaction"
          example: "2026-05-04T10:00:00Z"
        created_at:
          type: string
          format: date-time
          description: "Account creation timestamp"
          example: "2026-04-01T08:30:00Z"
        updated_at:
          type: string
          format: date-time
          description: "Last profile update timestamp"
          example: "2026-05-01T09:15:00Z"

    Calibration:
      type: object
      description: "Stores personalized facial mapping parameters to adjust the AI tracking sensitivity based on user's actual range of motion."
      properties:
        _id:
          type: string
          description: "Unique identifier for this calibration profile"
          example: "65f1a2b3c4d5e6f7a8b9c0d1"
        user_id:
          type: string
          description: "Reference to the User ObjectId"
          example: "60d5ecb8b392d700153f3a45"
        bounds:
          type: object
          description: "Coordinate boundaries derived from MediaPipe Face Mesh representing extreme limits of user's head movement."
          example:
            pitch_max: 0.25
            pitch_min: -0.15
            yaw_max: 0.30
            yaw_min: -0.30
        preferences:
          type: object
          description: "Custom mapping configurations mapping facial expressions to programming actions."
          example:
            drag_drop_gesture: "mouth_open"
            run_code_gesture: "double_nod"
            cursor_smoothing: 0.8
            camera_index: 0
        updated_at:
          type: string
          format: date-time
          description: "Timestamp of the last calibration update"
          example: "2026-05-04T11:04:39Z"

    Lesson:
      type: object
      description: "Represents a single learning module, including instructions, Blockly configurations, and testing logic."
      properties:
        _id:
          type: string
          description: "Unique Lesson ObjectId"
          example: "60d5ecb8b392d700153f3a55"
        topic_id:
          type: string
          description: "Reference to the parent Topic ObjectId"
          example: "60d5ecb8b392d700153f3a77"
        title:
          type: string
          description: "Display name of the lesson"
          example: "Python Basics: Using Print"
        order:
          type: integer
          description: "Display sequence within the topic"
          example: 1
        description:
          type: string
          description: "Theoretical background and learning objectives"
        difficulty:
          type: string
          description: "Tiered difficulty ranking"
          enum: [SSS, SS, S, A, B, C, D, F]
          example: "B"
        problem_statement:
          type: string
          description: "Markdown string explaining the task to the student"
          example: "Use the `print` block to output the word 'Hello World' to the Skulpt terminal."
        toolbox_config:
          type: object
          description: "Blockly toolbox JSON defining which blocks are available for drag-and-drop."
          example:
            kind: "categoryToolbox"
            contents:
              - kind: "category"
                name: "Text"
                colour: "160"
        initial_blocks:
          type: object
          description: "Pre-placed Blockly workspace JSON loaded when the lesson starts"
          example: { "blocks": { "languageVersion": 0, "blocks": [] } }
        hint:
          type: array
          description: "Progressive hints revealed to help the student"
          items:
            type: object
            properties:
              text:
                type: string
                description: "The hint content"
                example: "Look in the 'Text' category for the print block."
              type:
                type: string
                enum: [text, image, code]
                description: "Format of the hint"
                example: "text"
        solution:
          type: object
          description: "Reference solution workspace state (Admin/Teacher only)"
          example:
            {
              "blocks":
                { "type": "text_print", "inputs": { "TEXT": "Hello World" } },
            }
        public_testcases:
          type: array
          description: "Test cases executed via Piston visible to the student for self-checking"
          items:
            type: object
            properties:
              description:
                type: string
                description: "Human readable test intent"
                example: "Check if output is Hello World"
              expected_output:
                type: string
                description: "Exact stdout match required"
                example: "Hello World\n"
        base_xp:
          type: integer
          description: "Base experience points awarded on completion"
          example: 100
        duration:
          type: integer
          description: "Estimated completion time in minutes"
          example: 15
        is_active:
          type: boolean
          description: "Controls student visibility; false hides it for drafting"
          example: true

    UserProgress:
      type: object
      description: "Tracks an individual user's attempt and completion status for a specific lesson."
      properties:
        _id:
          type: string
          description: "Unique Progress ObjectId"
          example: "60d5ecb8b392d700153f3a99"
        user_id:
          type: string
          description: "Reference to the User ObjectId"
          example: "60d5ecb8b392d700153f3a45"
        lesson_id:
          type: string
          description: "Reference to the Lesson ObjectId"
          example: "60d5ecb8b392d700153f3a55"
        status:
          type: string
          description: "Current state of the lesson progress"
          enum: [in_progress, completed, failed]
          example: "completed"
        attempts_count:
          type: integer
          description: "Number of times the user triggered 'Run Code' (double nod)"
          example: 3
        workspace_state:
          type: object
          description: "Serialized JSON of the student's current Blockly workspace"
          example: { "blocks": { "type": "text_print" } }
        time:
          type: integer
          description: "Time taken in seconds to complete the lesson"
          example: 145
        points:
          type: integer
          description: "Points awarded for this attempt"
          example: 85
        submitted_at:
          type: string
          format: date-time
          description: "Timestamp of final submission"
          example: "2026-05-04T10:30:00Z"

    CustomBlock:
      type: object
      description: "Stores custom Blockly block definitions and their corresponding Python code generators."
      properties:
        _id:
          type: string
          description: "Unique Custom Block ObjectId"
          example: "60d5ecb8b392d700153f3a66"
        block_type:
          type: string
          description: "Internal identifier for the block"
          example: "enablecode_move_forward"
        definition:
          type: object
          description: "Blockly block definition JSON mapping inputs and colors"
          example:
            {
              "type": "enablecode_move_forward",
              "message0": "Move Forward",
              "colour": 230,
            }
        generator_code:
          type: string
          description: "JavaScript snippet that translates the block into Python string via Skulpt"
          example: "Blockly.Python['enablecode_move_forward'] = function(block) { return 'robot.move_forward()\\n'; };"
        category:
          type: string
          description: "Toolbox category where this block resides"
          example: "Movement"

    Topic:
      type: object
      description: "A grouping container for lessons, acting as a curriculum chapter."
      properties:
        _id:
          type: string
          description: "Unique Topic ObjectId"
          example: "60d5ecb8b392d700153f3a77"
        title:
          type: string
          description: "Display name of the course module"
          example: "Introduction to Python"
        description:
          type: string
          description: "Summary of what the student will learn"
          example: "Learn the basics of syntax, variables, and printing output."
        difficulty:
          type: string
          description: "Overall difficulty of the topic"
          enum: ["SSS", "SS", "S", "A", "B", "C", "D", "F"]
          example: "C"
        relevant_topic_ids:
          type: array
          description: "Array of related Topic ObjectIds for curriculum branching"
          items:
            type: string
          example: ["60d5ecb8b392d700153f3a78"]
        is_active:
          type: boolean
          description: "Visibility toggle for the topic"
          example: true

    # ----------------------------------------
    # Request Shapes
    # ----------------------------------------
    RegisterRequest:
      type: object
      description: "Payload required to register a new user."
      required:
        - email
        - password
        - name
        - role
      properties:
        email:
          type: string
          format: email
          description: "User's email"
          example: "newuser@enablecode.vn"
        password:
          type: string
          format: password
          description: "Plain text password (hashed by backend)"
          example: "P@ssw0rd123"
        name:
          type: string
          description: "Full display name"
          example: "Le Thi B"
        role:
          type: string
          description: "Requested account role"
          enum: ["student", "teacher", "admin"]
          example: "student"
        avatar:
          type: string
          description: "Optional URL to an avatar image"
          example: "https://enablecode.vn/avatars/default.png"

    LoginRequest:
      type: object
      description: "Credentials payload for authentication."
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: "Registered email address"
          example: "student_handsfree@enablecode.vn"
        password:
          type: string
          format: password
          description: "User's password"
          example: "P@ssw0rd123"

    AuthResponse:
      type: object
      description: "Response returned upon successful login/registration containing the JWT."
      properties:
        success:
          type: boolean
          description: "Indicates operation status"
          example: true
        token:
          type: string
          description: "JWT Bearer token for authorized routes"
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: "#/components/schemas/User"

    UpdateProfileRequest:
      type: object
      description: "Payload to update user metadata."
      properties:
        name:
          type: string
          description: "Updated display name"
          example: "Nguyen Huu Tri Updated"
        avatar:
          type: string
          description: "Updated avatar URL"
          example: "https://enablecode.vn/avatars/tri_new.jpg"

    CalibrationRequest:
      type: object
      description: "Payload sent from the React + AI frontend containing calculated MediaPipe bounds."
      required:
        - bounds
        - preferences
      properties:
        bounds:
          type: object
          description: "Calculated extreme coordinate boundaries of head movements."
          example:
            pitch_max: 0.25
            pitch_min: -0.15
            yaw_max: 0.30
            yaw_min: -0.30
        preferences:
          type: object
          description: "Action mapping preferences."
          example:
            drag_drop_gesture: "mouth_open"
            run_code_gesture: "double_nod"

    CreateLessonRequest:
      type: object
      description: "Payload for teachers/admins to author a new lesson."
      required:
        - topic_id
        - title
        - order
        - description
        - difficulty
        - problem_statement
        - toolbox_config
        - public_testcases
        - hidden_testcases
        - base_xp
        - duration
      properties:
        topic_id:
          type: string
          description: "Parent topic ObjectId"
          example: "60d5ecb8b392d700153f3a77"
        title:
          type: string
          description: "Lesson title"
          example: "Introduction to Loops"
        order:
          type: integer
          description: "Order index"
          example: 1
        difficulty:
          type: string
          enum: [SSS, SS, S, A, B, C, D, F]
          description: "Difficulty tier"
          example: "B"
        problem_statement:
          type: string
          description: "Task instructions"
          example: "Make the robot move forward exactly 5 times."
        toolbox_config:
          type: object
          description: "Blockly toolbox definition JSON"
          example: { "kind": "categoryToolbox", "contents": [] }
        initial_blocks:
          type: object
          description: "Starting state of the workspace"
          example: {}
        hint:
          type: array
          description: "Array of hint configurations"
          items:
            type: object
            properties:
              text:
                type: string
                example: "Use a FOR block."
              type:
                type: string
                enum: [text, image, code]
                example: "text"
        solution:
          type: object
          description: "Solution workspace definition"
          example: {}
        public_testcases:
          type: array
          description: "Visible Piston execution testcases"
          items:
            type: object
            properties:
              description:
                type: string
                example: "Moves 5 times"
              expected_output:
                type: string
                example: "FORWARD x 5"
        hidden_testcases:
          type: array
          description: "Hidden Piston execution testcases"
          items:
            type: object
            properties:
              description:
                type: string
                example: "Edge case testing"
              expected_output:
                type: string
                example: "FORWARD x 5"
        base_xp:
          type: integer
          description: "Reward XP"
          example: 100
        duration:
          type: integer
          description: "Expected time in minutes"
          example: 15
        is_active:
          type: boolean
          description: "Publish status"
          default: true

    UpdateLessonRequest:
      type: object
      description: All fields are optional — only include fields to change.
      properties:
        topic_id:
          type: string
        title:
          type: string
        order:
          type: integer
        description:
          type: string
        difficulty:
          type: string
          enum: [SSS, SS, S, A, B, C, D, F]
        problem_statement:
          type: string
        toolbox_config:
          type: object
        initial_blocks:
          type: object
        hint:
          type: array
          items:
            type: object
        solution:
          type: object
        public_testcases:
          type: array
          items:
            type: object
        hidden_testcases:
          type: array
          items:
            type: object
        base_xp:
          type: integer
        duration:
          type: integer
        is_active:
          type: boolean

    SubmitLessonRequest:
      type: object
      description: "Payload sent when user double-nods to execute and submit their code."
      required:
        - workspace_state
        - python_code
      properties:
        python_code:
          type: string
          description: "The compiled Python source code generated from the student's Blockly workspace to be executed."
          example: "print('Hello World')\n"
        workspace_state:
          type: object
          description: "Serialized Blockly workspace XML/JSON to be executed"
          example:
            {
              "blocks":
                { "type": "text_print", "inputs": { "TEXT": "Hello World" } },
            }
        time_taken:
          type: integer
          description: "Time spent on this attempt in seconds"
          example: 120

    SubmitLessonResponse:
      type: object
      description: "Response returning the execution results and updated progress."
      properties:
        progress:
          $ref: "#/components/schemas/UserProgress"
        result:
          type: object
          description: "Grading results from the backend"
          properties:
            passed:
              type: boolean
              description: "Did the code pass all hidden testcases?"
              example: true
            points_earned:
              type: integer
              description: "Amount of score awarded based on attempt count and base_xp"
              example: 85
            testcase_results:
              type: array
              description: "Results mapping to the public_testcases"
              items:
                type: object
                properties:
                  description:
                    type: string
                    example: "Check if output is Hello World"
                  passed:
                    type: boolean
                    example: true
                  actual_output:
                    type: string
                    example: "Hello World\n"
                  expected_output:
                    type: string
                    example: "Hello World\n"

    SaveProgressRequest:
      type: object
      description: "Payload to save the current workspace state as a draft."
      required:
        - workspace_state
      properties:
        workspace_state:
          type: object
          description: "Current Blockly workspace state to save as draft"
          example: { "blocks": { "type": "text_print" } }