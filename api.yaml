openapi: 3.0.0
info:
  title: Enable Code API - Complete Specification
  version: 1.0.0
  description: >
    Complete API endpoints for User Authentication, Lessons, User Progress,
    and Custom Blocks for the Enable Code platform.
    This version includes suggested additional endpoints (like deleting users, getting user stats) 
    to make the API more robust.
servers:
  - url: http://localhost:5000
    description: Local Development Server

paths:
  # ========================================
  # AUTHENTICATION
  # ========================================
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Creates a new user account in the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad request (e.g., email already exists)

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: User Login
      description: Authenticates a user and returns a JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorized (Invalid email or password)

  # ========================================
  # USERS & PROFILE
  # ========================================
  /api/users/profile:
    get:
      tags:
        - Users
      summary: Get user profile
      description: Retrieves the profile data of the currently authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
    put:
      tags:
        - Users
      summary: Update user profile
      description: Updates basic profile information like name and avatar.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
    delete:
      tags:
        - Users
      summary: Delete user account
      description: (Added Suggestion) Deletes the currently authenticated user's account and associated data.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account deleted successfully
        '401':
          description: Unauthorized

  /api/users/stats:
    get:
      tags:
        - Users
      summary: Get user statistics
      description: (Added Suggestion) Retrieves aggregated stats for the user (total score, streak, lessons completed).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User statistics retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_score:
                    type: integer
                  streak:
                    type: integer
                  lessons_completed:
                    type: integer
                  level:
                    type: integer
        '401':
          description: Unauthorized

  /api/users/calibration:
    put:
      tags:
        - Users
      summary: Recalibrate AI settings
      description: Updates the user's specific facial/gesture calibration settings.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalibrationRequest'
      responses:
        '200':
          description: Calibration settings updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
  # ========================================
  # TOPICS
  # ========================================
  /api/topics:
    get:
      tags:
        - Topics
      summary: Get all topics
      description: Retrieves a list of all educational topics.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Topic'

  /api/topics/{topicId}/lessons:
    get:
      tags:
        - Topics
      summary: Get lessons by topic
      description: Retrieves all lessons belonging to a specific topic.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: topicId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: A list of lessons for the topic
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lesson'
  # ========================================
  # LESSONS
  # ========================================
  /api/lessons:
    get:
      tags:
        - Lessons
      summary: Get all lessons
      description: >
        Retrieves a paginated list of all lessons. Supports filtering by topic,
        difficulty, active status, and required level. Admin/teacher can see
        inactive lessons; students only see active ones.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: topic_id
          schema:
            type: string
          description: Filter lessons by topic ObjectId
        - in: query
          name: difficulty
          schema:
            type: string
            enum: [SSS, SS, S, A, B, C, D, F]
          description: Filter by difficulty tier
        - in: query
          name: is_active
          schema:
            type: boolean
          description: Filter by active status (admin/teacher only)
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Paginated list of lessons
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lesson'
                  total:
                    type: integer
                    example: 42
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 20
        '401':
          description: Unauthorized

    post:
      tags:
        - Lessons
      summary: Create a new lesson
      description: Creates a new lesson. Restricted to admin and teacher roles.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLessonRequest'
      responses:
        '201':
          description: Lesson created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          description: Validation error
        '403':
          description: Forbidden — insufficient role

  /api/lessons/{lessonId}:
    get:
      tags:
        - Lessons
      summary: Get a specific lesson
      description: >
        Retrieves the full details of a lesson by its ID including theory,
        problem statement, toolbox config, initial blocks, and public test cases.
        Hidden test cases are excluded from this response.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
          example: "60d5ecb8b392d700153f3a55"
      responses:
        '200':
          description: Lesson details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — lesson level requirement not met
        '404':
          description: Lesson not found

    put:
      tags:
        - Lessons
      summary: Update a lesson
      description: >
        Updates any field of an existing lesson. Restricted to admin and teacher roles.
        Partial updates are supported — only send fields that need to change.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLessonRequest'
      responses:
        '200':
          description: Lesson updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lesson'
        '400':
          description: Validation error
        '403':
          description: Forbidden — insufficient role
        '404':
          description: Lesson not found

    delete:
      tags:
        - Lessons
      summary: Delete a lesson
      description: >
        Permanently deletes a lesson and all associated user progress records.
        Restricted to admin role only.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lesson deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Lesson deleted successfully"
        '403':
          description: Forbidden — admin only
        '404':
          description: Lesson not found

  /api/lessons/{lessonId}/submit:
    post:
      tags:
        - Lessons
      summary: Submit lesson workspace
      description: >
        Submits the user's final Blockly workspace for grading. The backend
        executes the generated code against hidden test cases, computes accuracy,
        awards XP/points based on base_xp and performance, updates UserProgress
        status to "completed", and updates the user's total_score, streak, and
        lessons_completed counters.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitLessonRequest'
      responses:
        '200':
          description: Submission graded and progress updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitLessonResponse'
        '400':
          description: Invalid workspace state or missing required fields
        '401':
          description: Unauthorized
        '404':
          description: Lesson not found

  /api/lessons/{lessonId}/save-progress:
    post:
      tags:
        - Lessons
      summary: Save workspace progress (draft)
      description: >
        Autosaves the current state of the user's Blockly workspace without
        grading. Creates or updates a UserProgress record with status "in_progress".
        Used for resume functionality.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveProgressRequest'
      responses:
        '200':
          description: Workspace progress saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProgress'
        '401':
          description: Unauthorized
        '404':
          description: Lesson not found

  /api/lessons/{lessonId}/progress:
    get:
      tags:
        - Lessons
      summary: Get current user's progress for a lesson
      description: >
        Returns the authenticated user's UserProgress record for this lesson,
        including saved workspace state (for resume), attempts count, and
        last submission result. Returns 404 if the user has never started the lesson.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User progress for the lesson
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProgress'
        '401':
          description: Unauthorized
        '404':
          description: No progress record found for this lesson

  /api/lessons/{lessonId}/hint:
    get:
      tags:
        - Lessons
      summary: Get hints for a lesson
      description: >
        Returns the ordered list of hints for the lesson. Hints are progressively
        revealed — the client should track which index the user is on and request
        the next one as needed.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
        - in: query
          name: index
          schema:
            type: integer
            default: 0
          description: Zero-based index of the hint to retrieve
      responses:
        '200':
          description: Hint returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  index:
                    type: integer
                    example: 0
                  total:
                    type: integer
                    example: 3
                  hint:
                    type: object
                    description: Hint object from the lesson's hint array
                    example: { "text": "Try using a for loop with range(5).", "type": "text" }
        '401':
          description: Unauthorized
        '404':
          description: Lesson not found or hint index out of range

  /api/lessons/{lessonId}/toggle-active:
    patch:
      tags:
        - Lessons
      summary: Toggle lesson active status
      description: >
        Flips the is_active flag on a lesson. Inactive lessons are hidden from
        students but visible to admin/teacher. Restricted to admin and teacher roles.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Active status toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                  is_active:
                    type: boolean
                    example: false
        '403':
          description: Forbidden — admin/teacher only
        '404':
          description: Lesson not found

  # ========================================
  # USER PROGRESS
  # ========================================
  /api/progress:
    get:
      tags:
        - Progress
      summary: Get all user progress
      description: (Added Suggestion) Retrieves all progress records for the authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of user progress records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserProgress'
        '401':
          description: Unauthorized

  /api/progress/{lessonId}:
    get:
      tags:
        - Progress
      summary: Get progress for a specific lesson
      description: (Added Suggestion) Retrieves the user's progress for a specific lesson ID.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: lessonId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Progress retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProgress'
        '404':
          description: Progress not found

  # ========================================
  # CUSTOM BLOCKS
  # ========================================
  /api/custom-blocks:
    get:
      tags:
        - Custom Blocks
      summary: Get all custom blocks
      description: Loads the definitions and Python generator code for custom Blockly blocks from the database.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: category
          schema:
            type: string
          description: Filter blocks by category
      responses:
        '200':
          description: Custom blocks loaded
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomBlock'

  /api/custom-blocks/{blockId}:
    get:
      tags:
        - Custom Blocks
      summary: Get a specific custom block
      description: (Added Suggestion) Retrieves details for a specific custom block.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: blockId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Custom block details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomBlock'
        '404':
          description: Custom block not found

  # ========================================
  # LEADERBOARD
  # ========================================
  /api/leaderboard:
    get:
      tags:
        - Leaderboard
      summary: Get user leaderboard
      description: Retrieves a ranking of users based on their total score.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of users to return
      responses:
        '200':
          description: Leaderboard ranking
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id:
                      type: string
                    name:
                      type: string
                    avatar:
                      type: string
                    total_score:
                      type: integer
                    lessons_completed:
                      type: integer

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ----------------------------------------
    # Core Data Schemas
    # ----------------------------------------
    User:
      type: object
      properties:
        _id:
          type: string
          example: "60d5ecb8b392d700153f3a45"
        email:
          type: string
          format: email
          example: "user@example.com"
        role:
          type: string
          example: "student"
        name:
          type: string
          example: "Nguyen Van A"
        avatar:
          type: string
          example: "https://example.com/avatar.jpg"
        calibration_settings:
          type: object
          example: { "x_threshold": 0.5, "y_threshold": 0.3 }
        total_score:
          type: integer
          example: 1200
        lessons_completed:
          type: integer
          example: 5
        streak:
          type: integer
          example: 3
        level:
          type: integer
          example: 2
        last_active_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Lesson:
      type: object
      properties:
        _id:
          type: string
          example: "60d5ecb8b392d700153f3a55"
        topic_id:
          type: string
          description: "Reference to the parent Topic ObjectId"
          example: "60d5ecb8b392d700153f3a77"
        title:
          type: string
          example: "Introduction to Loops"
        order:
          type: integer
          description: "Display order within the topic"
          example: 1
        difficulty:
          type: string
          enum: [SSS, SS, S, A, B, C, D, F]
          example: "B"
        problem_statement:
          type: string
          example: "Make the robot move forward exactly 5 times."
        toolbox_config:
          type: object
          description: "Blockly toolbox JSON — defines which blocks are available to the student"
          example:
            kind: "categoryToolbox"
            contents:
              - kind: "category"
                name: "Movement"
                colour: "160"
        initial_blocks:
          type: object
          description: "Pre-placed Blockly workspace XML/JSON loaded when the lesson starts"
        hint:
          type: array
          description: "Ordered list of progressive hint objects"
          items:
            type: object
            properties:
              text:
                type: string
                example: "Try using a for loop with range(5)."
              type:
                type: string
                enum: [text, image, code]
                example: "text"
        solution:
          type: object
          description: "Reference solution workspace state — only returned for admin/teacher roles"
        public_testcases:
          type: array
          description: "Test cases visible to the student for self-checking"
          items:
            type: object
            properties:
              description:
                type: string
                example: "Robot moves forward 5 steps"
              expected_output:
                type: string
                example: "FORWARD FORWARD FORWARD FORWARD FORWARD"
        hidden_testcases:
          type: array
          description: "Test cases used for grading — never exposed to students"
          items:
            type: object
            properties:
              description:
                type: string
              expected_output:
                type: string
        base_xp:
          type: integer
          description: "Base XP awarded on first completion"
          example: 100
        duration:
          type: integer
          description: "Estimated completion time in minutes"
          example: 15
        is_active:
          type: boolean
          description: "Controls student visibility; inactive lessons are admin/teacher-only"
          example: true

    UserProgress:
      type: object
      properties:
        _id:
          type: string
        user_id:
          type: string
        lesson_id:
          type: string
        status:
          type: string
          example: "completed"
        attempts_count:
          type: integer
          example: 3
        workspace_state:
          type: object
          description: "Serialized JSON of the Blockly workspace"
        time:
          type: integer
          description: "Time taken in seconds"
          example: 300
        submitted_at:
          type: string
          format: date-time

    CustomBlock:
      type: object
      properties:
        _id:
          type: string
          example: "60d5ecb8b392d700153f3a66"
        block_type:
          type: string
          example: "move_forward"
        definition:
          type: object
          description: "Blockly block definition JSON"
        generator_code:
          type: string
          example: "Blockly.Python['move_forward'] = function(block) { ... }"
        category:
          type: string
          example: "Movement"
    Topic:
      type: object
      properties:
        _id:
          type: string
          example: "60d5ecb8b392d700153f3a77"
        title:
          type: string
          example: "Loops and Iteration"
        description:
          type: string
          example: "Mastering the power of repeating code blocks."
        difficulty:
          type: string
          enum: ["SSS", "SS", "S", "A", "B", "C", "D", "F"]
        relevant_topic_ids:
          type: array
          items:
            type: string
          example: ["60d5ecb8b392d700153f3a78"]
        is_active:
          type: boolean
          example: true
    # ----------------------------------------
    # Request Shapes
    # ----------------------------------------
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - name
        - role
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "StrongP@ssw0rd"
        name:
          type: string
          example: "Nguyen Van A"
        role:
          type: string
          enum: ["student", "teacher", "admin"]
          example: "student"
        avatar:
          type: string
          description: "URL to the user's avatar image"
          example: "https://example.com/avatar.jpg"
        calibration_settings:
          type: object
          description: "Initial facial/gesture calibration settings"
          example: { "x_threshold": 0.5, "y_threshold": 0.3 }

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: '#/components/schemas/User'

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
        avatar:
          type: string

    CalibrationRequest:
      type: object
      required:
        - calibration_settings
      properties:
        calibration_settings:
          type: object
          description: Dynamic JSON object representing facial/gesture limits.
          example: 
            sensitivity: 0.8
            neutral_face_baseline: [120, 240]

    CreateLessonRequest:
      type: object
      required:
        - topic_id
        - title
        - order
        - difficulty
        - problem_statement
        - toolbox_config
        - public_testcases
        - hidden_testcases
        - base_xp
        - duration
      properties:
        topic_id:
          type: string
          example: "60d5ecb8b392d700153f3a77"
        title:
          type: string
          example: "Introduction to Loops"
        order:
          type: integer
          example: 1
        difficulty:
          type: string
          enum: [SSS, SS, S, A, B, C, D, F]
          example: "B"
        problem_statement:
          type: string
          example: "Make the robot move forward exactly 5 times."
        toolbox_config:
          type: object
        initial_blocks:
          type: object
        hint:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              type:
                type: string
                enum: [text, image, code]
        solution:
          type: object
        public_testcases:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
              expected_output:
                type: string
        hidden_testcases:
          type: array
          items:
            type: object
            properties:
              description:
                type: string
              expected_output:
                type: string
        base_xp:
          type: integer
          example: 100
        duration:
          type: integer
          example: 15
        is_active:
          type: boolean
          default: true

    UpdateLessonRequest:
      type: object
      description: All fields are optional — only include fields to change.
      properties:
        topic_id:
          type: string
        title:
          type: string
        order:
          type: integer
        difficulty:
          type: string
          enum: [SSS, SS, S, A, B, C, D, F]
        problem_statement:
          type: string
        toolbox_config:
          type: object
        initial_blocks:
          type: object
        hint:
          type: array
          items:
            type: object
        solution:
          type: object
        public_testcases:
          type: array
          items:
            type: object
        hidden_testcases:
          type: array
          items:
            type: object
        base_xp:
          type: integer
        duration:
          type: integer
        is_active:
          type: boolean

    SubmitLessonRequest:
      type: object
      required:
        - workspace_state
      properties:
        workspace_state:
          type: object
          description: "Serialized Blockly workspace XML/JSON to be executed and graded"
        time_taken:
          type: integer
          description: "Time spent on this attempt in seconds"
          example: 120

    SubmitLessonResponse:
      type: object
      properties:
        progress:
          $ref: '#/components/schemas/UserProgress'
        result:
          type: object
          properties:
            passed:
              type: boolean
              example: true
            points_earned:
              type: integer
              description: "Points awarded for this submission"
              example: 85
            xp_earned:
              type: integer
              description: "XP awarded (base_xp scaled by accuracy; 0 on retry)"
              example: 87
            testcase_results:
              type: array
              description: "Results for each public test case"
              items:
                type: object
                properties:
                  description:
                    type: string
                    example: "Robot moves forward 5 steps"
                  passed:
                    type: boolean
                    example: true
                  actual_output:
                    type: string
                    example: "FORWARD FORWARD FORWARD FORWARD FORWARD"
                  expected_output:
                    type: string
                    example: "FORWARD FORWARD FORWARD FORWARD FORWARD"
        user_stats:
          type: object
          description: "Updated user counters after this submission"
          properties:
            total_score:
              type: integer
              example: 1285
            lessons_completed:
              type: integer
              example: 6
            streak:
              type: integer
              example: 4
            level:
              type: integer
              example: 2

    SaveProgressRequest:
      type: object
      required:
        - workspace_state
      properties:
        workspace_state:
          type: object
          description: "Current Blockly workspace state to save as draft"