openapi: 3.0.3
info:
  title: AuditionCode-BE API
  version: 1.0.0
  description: >
    OpenAPI specification aligned with the AuditionCode-BE project structure.
    Stack: Node.js, Express 5, TypeScript, MongoDB, and Mongoose.
servers:
  - url: http://localhost:{port}/api
    description: Local development server
    variables:
      port:
        default: "5000"

tags:
  - name: Auth
    description: Public authentication endpoints
  - name: Users
    description: Authenticated user profile, stats, and calibration endpoints
  - name: Topics
    description: Topic and topic lesson endpoints
  - name: Lessons
    description: Lesson CRUD, submission, progress, and hint endpoints
  - name: Progress
    description: User lesson progress endpoints
  - name: Custom Blocks
    description: Blockly custom block endpoints
  - name: Leaderboard
    description: Public leaderboard endpoints

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/profile:
    get:
      tags: [Users]
      summary: Get authenticated user's profile
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Users]
      summary: Update profile info
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Users]
      summary: Delete the authenticated user account
      operationId: deleteAccount
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/stats:
    get:
      tags: [Users]
      summary: Get user stats
      operationId: getStats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStats"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users/calibration:
    get:
      tags: [Users]
      summary: Get user calibration settings
      operationId: getCalibration
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User calibration settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calibration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Users]
      summary: Update calibration settings
      operationId: updateCalibration
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCalibrationRequest"
      responses:
        "200":
          description: Updated calibration settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calibration"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /topics:
    get:
      tags: [Topics]
      summary: List all topics
      operationId: getAllTopics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Topic list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /topics/{topicId}/lessons:
    get:
      tags: [Topics]
      summary: Get lessons under a topic
      operationId: getLessonsByTopic
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TopicId"
      responses:
        "200":
          description: Lessons under the topic
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lesson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /lessons:
    get:
      tags: [Lessons]
      summary: List all lessons
      operationId: getAllLessons
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lesson list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lesson"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Lessons]
      summary: Create a new lesson
      operationId: createLesson
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLessonRequest"
      responses:
        "201":
          description: Lesson created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /lessons/{lessonId}:
    get:
      tags: [Lessons]
      summary: Get a single lesson
      operationId: getLesson
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LessonId"
      responses:
        "200":
          description: Lesson detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Lessons]
      summary: Update a lesson
      operationId: updateLesson
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LessonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLessonRequest"
      responses:
        "200":
          description: Lesson updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Lessons]
      summary: Delete a lesson
      operationId: deleteLesson
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LessonId"
      responses:
        "200":
          description: Lesson deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /lessons/{lessonId}/submit:
    post:
      tags: [Lessons]
      summary: Submit solution for grading
      operationId: submitLesson
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LessonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitLessonRequest"
      responses:
        "200":
          description: Submission graded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitLessonResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /lessons/{lessonId}/save-progress:
    post:
      tags: [Lessons]
      summary: Save workspace state
      operationId: saveProgress
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LessonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveProgressRequest"
      responses:
        "200":
          description: Progress saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProgress"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /lessons/{lessonId}/progress:
    get:
      tags: [Lessons]
      summary: Get user progress for lesson
      operationId: getUserLessonProgressFromLessons
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LessonId"
      responses:
        "200":
          description: User progress for lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /lessons/{lessonId}/hint:
    get:
      tags: [Lessons]
      summary: Retrieve a hint
      operationId: getHint
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LessonId"
      responses:
        "200":
          description: Hint response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HintResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /lessons/{lessonId}/toggle-active:
    patch:
      tags: [Lessons]
      summary: Toggle lesson visibility
      operationId: toggleLessonActive
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LessonId"
      responses:
        "200":
          description: Lesson active status toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lesson"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /progress:
    get:
      tags: [Progress]
      summary: Get all progress records for user
      operationId: getAllUserProgress
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User progress records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /progress/{lessonId}:
    get:
      tags: [Progress]
      summary: Get progress for specific lesson
      operationId: getUserLessonProgress
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LessonId"
      responses:
        "200":
          description: User progress for lesson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /custom-blocks:
    get:
      tags: [Custom Blocks]
      summary: List all custom Blockly blocks
      operationId: getAllCustomBlocks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Custom block list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomBlock"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /custom-blocks/{blockId}:
    get:
      tags: [Custom Blocks]
      summary: Get a specific custom block
      operationId: getCustomBlock
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BlockId"
      responses:
        "200":
          description: Custom block detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomBlock"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /leaderboard:
    get:
      tags: [Leaderboard]
      summary: Get ranked leaderboard
      operationId: getLeaderboard
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    LessonId:
      name: lessonId
      in: path
      required: true
      schema:
        type: string
      example: "60d5ecb8b392d700153f3a55"
    TopicId:
      name: topicId
      in: path
      required: true
      schema:
        type: string
      example: "60d5ecb8b392d700153f3a77"
    BlockId:
      name: blockId
      in: path
      required: true
      schema:
        type: string
      example: "60d5ecb8b392d700153f3a66"

  responses:
    BadRequest:
      description: Bad request or validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ObjectId:
      type: string
      pattern: "^[a-fA-F0-9]{24}$"
      example: "60d5ecb8b392d700153f3a45"

    User:
      type: object
      required: [email, passwordHash, role, name]
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        email:
          type: string
          format: email
          example: "student@example.com"
        passwordHash:
          type: string
          writeOnly: true
          example: "$2b$10$hashedPassword"
        role:
          type: string
          default: student
          example: student
        name:
          type: string
          example: "Nguyen Van A"
        avatar:
          type: string
          nullable: true
          example: "https://example.com/avatar.png"
        totalScore:
          type: number
          default: 0
          example: 1200
        lessonsCompleted:
          type: number
          default: 0
          example: 5
        streak:
          type: number
          default: 0
          example: 3
        level:
          type: number
          default: 0
          example: 2
        resetPasswordToken:
          type: string
          nullable: true
        resetPasswordExpires:
          type: string
          format: date-time
          nullable: true
        lastActiveDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserStats:
      type: object
      properties:
        totalScore:
          type: number
          example: 1200
        lessonsCompleted:
          type: number
          example: 5
        streak:
          type: number
          example: 3
        level:
          type: number
          example: 2

    Topic:
      type: object
      required: [title]
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        title:
          type: string
          example: "Introduction to Python"
        description:
          type: string
          nullable: true
          example: "Learn Python fundamentals."
        difficulty:
          description: Mixed difficulty value; current model default is medium.
          default: medium
          oneOf:
            - type: string
            - type: number
            - type: object
        relevantTopicIds:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/ObjectId"
        isActive:
          type: boolean
          default: true
          example: true

    Lesson:
      type: object
      required: [topicId, title]
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        topicId:
          $ref: "#/components/schemas/ObjectId"
        title:
          type: string
          example: "Python Basics: Print"
        description:
          type: string
          nullable: true
        order:
          type: number
          default: 0
          example: 1
        difficulty:
          description: Mixed difficulty value; current model default is medium.
          default: medium
          oneOf:
            - type: string
            - type: number
            - type: object
        problemStatement:
          type: string
          default: ""
          example: "Print Hello World."
        toolboxConfig:
          type: object
          default: {}
          additionalProperties: true
        initialBlocks:
          type: object
          default: {}
          additionalProperties: true
        hint:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/Hint"
        solution:
          type: object
          default: {}
          additionalProperties: true
        publicTestcases:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/Testcase"
        hiddenTestcases:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/Testcase"
        baseXp:
          type: number
          default: 0
          example: 100
        duration:
          type: number
          description: Expected time in seconds.
          default: 0
          example: 900
        isActive:
          type: boolean
          default: true

    UserProgress:
      type: object
      required: [userId, lessonId]
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        userId:
          $ref: "#/components/schemas/ObjectId"
        lessonId:
          $ref: "#/components/schemas/ObjectId"
        status:
          type: string
          default: not_started
          enum: [not_started, in_progress, completed, failed]
          example: in_progress
        attemptsCount:
          type: number
          default: 0
        hintsRevealed:
          type: array
          default: []
          items:
            type: number
        hasViewedSolution:
          type: boolean
          default: false
        workspaceState:
          type: object
          default: {}
          additionalProperties: true
        time:
          type: number
          description: Time spent in seconds.
          default: 0
        points:
          type: number
          default: 0
        submittedAt:
          type: string
          format: date-time
          nullable: true

    CustomBlock:
      type: object
      required: [blockType]
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        blockType:
          type: string
          example: enablecode_print
        definition:
          type: object
          additionalProperties: true
        generatorCode:
          type: string
          example: "Blockly.Python['enablecode_print'] = function(block) { return 'print()\\n'; };"
        category:
          type: string
          example: Text

    Calibration:
      type: object
      required: [userId]
      properties:
        _id:
          $ref: "#/components/schemas/ObjectId"
        userId:
          $ref: "#/components/schemas/ObjectId"
        bounds:
          type: object
          additionalProperties: true
          example:
            pitchMax: 0.25
            pitchMin: -0.15
            yawMax: 0.3
            yawMin: -0.3
        preferences:
          type: object
          additionalProperties: true
          example:
            dragDropGesture: mouth_open
            runCodeGesture: double_nod

    LeaderboardEntry:
      type: object
      properties:
        userId:
          $ref: "#/components/schemas/ObjectId"
        name:
          type: string
          example: "Nguyen Van A"
        avatar:
          type: string
          nullable: true
        totalScore:
          type: number
          example: 2450
        lessonsCompleted:
          type: number
          example: 12

    Hint:
      type: object
      additionalProperties: true
      properties:
        text:
          type: string
          example: "Use the print block."
        type:
          type: string
          example: text

    Testcase:
      type: object
      additionalProperties: true
      properties:
        input:
          type: string
          example: ""
        expectedOutput:
          type: string
          example: "Hello World\n"
        description:
          type: string
          example: "Checks exact output."

    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        name:
          type: string
        role:
          type: string
          default: student
        avatar:
          type: string
          nullable: true

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        user:
          $ref: "#/components/schemas/User"

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
        avatar:
          type: string
          nullable: true

    UpdateCalibrationRequest:
      type: object
      properties:
        bounds:
          type: object
          additionalProperties: true
        preferences:
          type: object
          additionalProperties: true

    CreateLessonRequest:
      type: object
      required: [topicId, title]
      properties:
        topicId:
          $ref: "#/components/schemas/ObjectId"
        title:
          type: string
        description:
          type: string
        order:
          type: number
          default: 0
        difficulty:
          oneOf:
            - type: string
            - type: number
            - type: object
          default: medium
        problemStatement:
          type: string
          default: ""
        toolboxConfig:
          type: object
          additionalProperties: true
          default: {}
        initialBlocks:
          type: object
          additionalProperties: true
          default: {}
        hint:
          type: array
          items:
            $ref: "#/components/schemas/Hint"
          default: []
        solution:
          type: object
          additionalProperties: true
          default: {}
        publicTestcases:
          type: array
          items:
            $ref: "#/components/schemas/Testcase"
          default: []
        hiddenTestcases:
          type: array
          items:
            $ref: "#/components/schemas/Testcase"
          default: []
        baseXp:
          type: number
          default: 0
        duration:
          type: number
          default: 0
        isActive:
          type: boolean
          default: true

    UpdateLessonRequest:
      allOf:
        - $ref: "#/components/schemas/CreateLessonRequest"
      description: Same fields as CreateLessonRequest, but all fields are optional at controller level.

    SubmitLessonRequest:
      type: object
      required: [workspaceState]
      properties:
        workspaceState:
          type: object
          additionalProperties: true
        code:
          type: string
          description: Optional generated code if the frontend submits generated source.
        time:
          type: number
          description: Time spent in seconds.

    SubmitLessonResponse:
      type: object
      properties:
        progress:
          $ref: "#/components/schemas/UserProgress"
        passed:
          type: boolean
        points:
          type: number
        output:
          type: string
        testcaseResults:
          type: array
          items:
            type: object
            additionalProperties: true

    SaveProgressRequest:
      type: object
      required: [workspaceState]
      properties:
        workspaceState:
          type: object
          additionalProperties: true
        time:
          type: number
          description: Time spent in seconds.

    HintResponse:
      type: object
      properties:
        hint:
          $ref: "#/components/schemas/Hint"
        hintsRevealed:
          type: array
          items:
            type: number

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Success

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: Something went wrong